name: Scrape NSP scheme data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Perl dependencies
        run: sudo apt-get update && sudo apt-get install -y libhtml-parser-perl

      - name: Run scraper
        run: |
          cd scraper
          perl scrape_nsp.pl
          cp schemes_live.json ../schemes.json

      - name: Commit and push if data changed
        run: |
          git config user.name "schemeconnect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schemes.json
          if git diff --cached --quiet; then
            echo "No changes in scheme data — nothing to commit."
          else
            git commit -m "Auto-update scheme data ($(date -u +%Y-%m-%d))"
            git push
          fi
